.odds-section{margin-top:28px;background:#171a20;color:#fff;border-radius:26px;padding:clamp(18px,3vw,28px);position:relative;overflow:hidden}
.odds-section:before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 28px #ffffff08,0 0 0 60px #ffffff08;pointer-events:none}
.odds-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;position:relative;z-index:1;margin-bottom:18px}
.odds-head h2{font-size:clamp(24px,4vw,34px);letter-spacing:-1.5px;margin:6px 0}
.odds-head p{font-size:12px;color:#b5bac3;line-height:1.5;max-width:520px;margin:0}
.odds-head .smalllabel{color:var(--lime)}
.odds-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:relative;z-index:1}
.odds-controls .field{background:#252830;border-color:#3b3f49;color:white}
.odds-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr);gap:14px;position:relative;z-index:1}
.odds-list{display:flex;flex-direction:column;gap:9px}
.odds-pick{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:11px;align-items:center;background:#22252c;border:1px solid #383c46;border-radius:15px;padding:13px}
.odds-pick input{accent-color:var(--lime);width:17px;height:17px}
.odds-pick strong{display:block;font-size:12px;line-height:1.4}
.odds-pick small{display:block;font-size:10px;color:#aeb4be;margin-top:3px;line-height:1.4}
.pick-metrics{text-align:right;white-space:nowrap}
.pick-metrics b{display:block;color:var(--lime);font-size:17px;letter-spacing:-.5px}
.pick-metrics small{font-size:10px;color:#c1c6ce}
.probbar{height:4px;background:#41454f;border-radius:99px;margin-top:7px;overflow:hidden}
.probbar span{display:block;height:100%;background:var(--lime);border-radius:99px}
.odds-summary{background:var(--lime);color:var(--ink);border-radius:20px;padding:20px;align-self:start}
.odds-summary .smalllabel{color:#525d20}
.odds-summary h3{font-size:17px;margin:8px 0 2px;letter-spacing:-.5px}
.odds-total{font-size:47px;font-weight:950;letter-spacing:-3px;line-height:1.1;margin:14px 0 3px}
.odds-summary p{font-size:11px;line-height:1.5;color:#444b2a}
.odds-statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}
.odds-stat{border:1px solid #a9c53b;border-radius:12px;padding:10px}
.odds-stat small{font-size:9px;text-transform:uppercase;letter-spacing:.7px;display:block;color:#525d20}
.odds-stat strong{font-size:18px;display:block;margin-top:3px}
.odds-summary .btn{border-color:var(--ink);width:100%;margin-top:5px}
.odds-footnote{font-size:10px;color:#b6bbc4;line-height:1.55;margin-top:13px;position:relative;z-index:1}
.odds-empty{padding:22px;border:1px dashed #454954;border-radius:14px;color:#b5bac3;font-size:12px;line-height:1.5}
@media(max-width:700px){.odds-layout{grid-template-columns:1fr}.odds-head{align-items:flex-start;flex-direction:column}.odds-summary{order:-1}.odds-total{font-size:42px}}

</style>
